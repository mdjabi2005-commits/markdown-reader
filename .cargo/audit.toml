# cargo-audit configuration — https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# The CI `audit` job (.github/workflows/ci.yml) runs `cargo audit`, which reads
# this file. It reports vulnerabilities as errors and unmaintained/yanked as
# warnings. `cargo-deny` (deny.toml) is the SOURCE OF TRUTH for advisory policy;
# this file mirrors the SAME ignore set so the two gates agree and the audit
# signal stays green-when-clean (a perpetually-red audit masks new advisories).
#
# Every entry MUST also be justified in deny.toml. Re-audit quarterly and drop
# anything whose upstream has shipped a fix. Keep the two lists in sync.

[advisories]
ignore = [
    # --- Unmaintained (warnings; kept in sync with deny.toml) -----------------
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained (via syntect)
    "RUSTSEC-2024-0320", # yaml-rust 0.4.5 unmaintained (via syntect)
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1 unmaintained (via mermaid-rs-renderer/resvg)
    "RUSTSEC-2026-0206", # rustybuzz 0.20.1 unmaintained (via mermaid-rs-renderer/resvg)
    # --- Vulnerabilities with no upgrade path (see deny.toml for full rationale)
    # quick-xml < 0.41 DoS, reached ONLY via syntect -> plist parsing bundled
    # theme files (never attacker-controlled); the 0.41 fix is a semver-breaking
    # bump that `plist` pins away from. No upgrade path from our side.
    "RUSTSEC-2026-0194", # quick-xml 0.38.4 duplicate-attr DoS (via syntect/plist)
    "RUSTSEC-2026-0195", # quick-xml 0.38.4 namespace-alloc DoS (via syntect/plist)
]
